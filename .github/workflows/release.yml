# Compila FileNote para Windows y macOS en los servidores de GitHub y lo publica como release.
# Se lanza a mano desde la pestaña "Actions" o al subir una etiqueta tipo v1.0.1.
# La release se crea como borrador y solo se publica cuando ambos instaladores están listos,
# así la app nunca ve una versión "a medias" al buscar actualizaciones.
name: Publicar

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: macos-latest
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Crear instalador
        run: npm run dist:${{ matrix.target }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Versión
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: FileNote ${{ steps.ver.outputs.v }}
          draft: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          n=$(gh release view "v$v" --json assets -q '.assets | length')
          echo "Archivos en la release: $n"
          if [ "$n" -lt 12 ]; then echo "Faltan instaladores"; exit 1; fi
          gh release edit "v$v" --draft=false --latest
